<script>window.VMC=window.VMC||{};
VMC.normalize=raw=>raw.replace(/[xX*]/g,'×').replace(/−/g,'-');
VMC.formatFactor=value=>value<0?'('+value+')':String(value);
VMC.formatExpression=factors=>factors.map((n,i)=>i?VMC.formatFactor(n):String(n)).join(' × ');
VMC.parseExpression=function(raw){
 const normalized=VMC.normalize(raw).trim();
 // Deliberately parse a multiplication grammar, never evaluate source text.
 const factor='(?:[+-]?\\d+|\\(\\s*[+-]?\\d+\\s*\\))';
 if(!new RegExp('^\\s*'+factor+'(?:\\s*×\\s*'+factor+')+\\s*$').test(normalized))return null;
 const factors=normalized.split('×').map(part=>Number(part.replace(/[()\s]/g,'')));
 if(factors.some(n=>!Number.isSafeInteger(n)))return null;
 let product=1;for(const factor of factors){product*=factor;if(!Number.isSafeInteger(product))return null;}
 return {factors,product:Object.is(product,-0)?0:product};
};
VMC.createMultiplication=function(firstFactor,secondFactor){
 const model={kind:'multiplication',factors:[firstFactor,secondFactor],firstFactor,secondFactor,product:firstFactor*secondFactor,state:'CREATE',outerNegative:firstFactor<0,displayFactors:[Math.abs(firstFactor),Math.abs(secondFactor)],groups:[]};
 for(let i=0;i<Math.abs(firstFactor);i++)model.groups.push({id:'group-'+(i+1),ordinal:i+1,sign:1,disks:Array.from({length:Math.abs(secondFactor)},(_,j)=>({id:'disk-'+i+'-'+j})),pose:{x:0,y:0,scale:.05,opacity:0,labelOpacity:1},element:null});
 return model;
};
VMC.createComposite=function(base,factor){return {kind:'composite',base,factors:[...base.factors,factor],factor,copies:Math.abs(factor),product:base.product*factor,state:'CREATE',layers:[]};};

VMC.parseAddition=function(raw){
 const text=VMC.normalize(raw).trim();let depth=0,split=-1;
 for(let i=0;i<text.length;i++){if(text[i]==='(')depth++;if(text[i]===')')depth--;if(depth<0)return null;if(text[i]==='+'&&depth===0&&i>0){split=i;break;}}
 if(depth!==0||split<0)return null;
 let left=text.slice(0,split).trim();const right=text.slice(split+1).trim();
 if(left.startsWith('(')){let d=0,end=-1;for(let i=0;i<left.length;i++){if(left[i]==='(')d++;if(left[i]===')')d--;if(d===0){end=i;break;}}if(end===left.length-1)left=left.slice(1,-1).trim();}
 if(!/^(?:[+-]?\d+|\(\s*[+-]?\d+\s*\))$/.test(right))return null;
 const addend=Number(right.replace(/[()\s]/g,''));
 const simple=/^(?:[+-]?\d+|\(\s*[+-]?\d+\s*\))$/.test(left);
 const base=simple?{factors:[Number(left.replace(/[()\s]/g,''))],product:Number(left.replace(/[()\s]/g,''))}:VMC.parseExpression(left);
 if(!base||!Number.isSafeInteger(base.product)||!Number.isSafeInteger(addend)||!Number.isSafeInteger(base.product+addend))return null;
 return {base,addend,product:base.product+addend,expression:(base.factors.length>1?'('+VMC.formatExpression(base.factors)+')':String(base.product))+' + '+VMC.formatFactor(addend)};
};

VMC.modelText=model=>model.expression||VMC.formatExpression(model.factors||[model.product]);
</script><script>VMC.layout=function(model){
 const rows=model.groups.length,cols=Math.abs(model.secondFactor);
 // Close-fitting unit disks; group boundaries are temporary entrance objects.
 let gapX=Math.min(36,460/Math.max(1,cols)),gapY=Math.min(35,360/Math.max(1,rows));
 let radius=Math.min(17,160/Math.max(1,cols),(gapY-1)/2);
 gapX=radius*2;gapY=radius*2;
 let loopHeight=radius*2+12,loopWidth=Math.max(48,(Math.max(1,cols)-1)*gapX+radius*2+48);
 // Fit the array and dimension labels generously into the whole SVG scene.
 const baseHeight=Math.max(loopHeight,(rows-1)*gapY+loopHeight)+24;
 const zoom=Math.min(3,900/(loopWidth+80),460/(baseHeight+34));
 radius*=zoom;gapX*=zoom;gapY*=zoom;loopHeight*=zoom;loopWidth*=zoom;
 const centerY=250+18*zoom,firstY=centerY-(rows-1)*gapY/2;
 model.geometry={rows,cols,radius,gapX,gapY,loopHeight,loopWidth,zoom};
 const approved=[{x:200,y:55},{x:800,y:55},{x:200,y:155},{x:800,y:155},{x:200,y:255},{x:800,y:255}];
 const initialRows=Math.ceil(rows/2),initialStep=Math.min(100,360/Math.max(1,initialRows));
 model.groups.forEach((group,i)=>{
   group.start=rows===6?approved[i]:{x:i%2?800:200,y:55+Math.floor(i/2)*initialStep};
   group.end={x:500,y:firstY+i*gapY};
   // Larger row counts need entrances above their destinations to keep a fall.
   if(rows!==6)group.start.y=Math.min(group.start.y,group.end.y-45);
   group.startScale=Math.min(1.3,330/loopWidth);
   const control={x:500,y:group.start.y},lerp=(a,b,t)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
   group.path=[group.start,lerp(group.start,control,2/3),lerp(group.end,control,2/3),group.end];
 });
 const width=Math.max(radius*2,(cols-1)*gapX+radius*2)+22*zoom,height=Math.max(radius*2,(rows-1)*gapY+radius*2)+22*zoom;
 model.bounds={x:500-width/2,y:firstY-radius-11*zoom,width,height};return model;
};
VMC.pointOnCurve=function(p,t){const u=1-t;return {x:u*u*u*p[0].x+3*u*u*t*p[1].x+3*u*t*t*p[2].x+t*t*t*p[3].x,y:u*u*u*p[0].y+3*u*u*t*p[1].y+3*u*t*t*p[2].y+t*t*t*p[3].y};};
</script><script>VMC.TIMING=Object.freeze({bloopMs:440,groupStaggerMs:240,compressedStaggerMs:150,fallStartMs:320,moveMs:1100,labelFadeMs:320,resultDelayMs:100,signHoldMs:180,signSweepMs:1100,layerMoveMs:650,layerBloopMs:440,layerStaggerMs:240,reducedBloopMs:160,reducedStaggerMs:180,reducedHoldMs:440,reducedMoveMs:200});
const svgNS='http://www.w3.org/2000/svg',clamp=t=>Math.max(0,Math.min(1,t)),smooth=t=>t*t*(3-2*t);
function svgElement(tag,attributes){const el=document.createElementNS(svgNS,tag);for(const [key,value]of Object.entries(attributes))el.setAttribute(key,value);return el;}
VMC.bloopScale=function(t){const k=[[0,.05],[.45,1.18],[.7,.97],[1,1]];for(let i=1;i<k.length;i++)if(t<=k[i][0]){const a=k[i-1],b=k[i],u=(t-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*(1-Math.pow(1-u,3));}return 1;};
VMC.buildGroup=function(group,geometry){
 const el=svgElement('g',{'data-group-id':group.id,'data-sign':group.sign,style:`--scene-scale:${geometry.zoom}`,role:'img','aria-label':`Group ${group.ordinal}: ${geometry.cols} positive counters`});
 group.title=svgElement('title',{});group.title.textContent=el.getAttribute('aria-label');el.append(group.title);
 const makeFace=sign=>{
  const face=svgElement('g',{class:'group-face','data-face-sign':sign});
  face.append(svgElement('rect',{class:'loop',x:-geometry.loopWidth/2,y:-geometry.loopHeight/2,width:geometry.loopWidth,height:geometry.loopHeight,rx:geometry.loopHeight/2}));
  const r=geometry.radius;
  group.disks.forEach((disk,i)=>{const x=(i-(geometry.cols-1)/2)*geometry.gapX,o=VMC.makeBlock(disk.id,x,r);o.setAttribute('data-exposed-top',group.ordinal===1?'true':'false');o.setAttribute('data-exposed-side',i===geometry.cols-1?'true':'false');face.append(o);});
  return face;
 };
 group.baseFace=makeFace(1);group.scanFace=makeFace(-1);
 // Both appearances belong to the same persistent mathematical group. One
 // clipping edge reveals the opposite appearance across the entire object.
 const clipId='scan-'+group.id;
 const defs=svgElement('defs',{}),clip=svgElement('clipPath',{id:clipId,clipPathUnits:'userSpaceOnUse'});
 group.clipRect=svgElement('rect',{x:0,y:0,width:0,height:0});clip.append(group.clipRect);defs.append(clip);el.append(defs);
 group.scanFace.setAttribute('clip-path',`url(#${clipId})`);el.append(group.baseFace,group.scanFace);
 group.label=svgElement('text',{class:'group-number',x:0,y:geometry.loopHeight/2+27*geometry.zoom,style:`font-size:${20*geometry.zoom}px`});group.label.textContent=group.ordinal;el.append(group.label);group.element=el;return el;
};
// A persistent unit has a square face and two depth faces, initially collapsed.
VMC.makeBlock=function(id,x,r){
 const unit=svgElement('g',{'data-disk-id':id,'data-unit-shape':'block','data-center-x':x,'data-radius':r});
 unit.append(svgElement('path',{class:'block-top'}),svgElement('path',{class:'block-side'}),svgElement('rect',{class:'disk',x:x-r,y:-r,width:2*r,height:2*r,rx:0}));
 VMC.turnBlock(unit,0);return unit;
};
VMC.turnBlock=function(unit,t){
 const x=Number(unit.getAttribute('data-center-x')),r=Number(unit.getAttribute('data-radius')),dx=r*.90*t,dy=-r*(.65+.18*.90*t)*t;
 const top=unit.children[0],side=unit.children[1];
 top.setAttribute('d',`M ${x-r} ${-r} L ${x-r+dx} ${-r+dy} L ${x+r+dx} ${-r+dy} L ${x+r} ${-r} Z`);
 side.setAttribute('d',`M ${x+r} ${-r} L ${x+r+dx} ${-r+dy} L ${x+r+dx} ${r+dy} L ${x+r} ${r} Z`);
 top.setAttribute('opacity',t>0&&unit.getAttribute('data-exposed-top')!=='false'?1:0);side.setAttribute('opacity',t>0&&unit.getAttribute('data-exposed-side')!=='false'?1:0);unit.setAttribute('data-turn',t);
};
VMC.turnDisks=function(node,amount){for(const unit of node.querySelectorAll('[data-disk-id]'))VMC.turnBlock(unit,amount);};
VMC.setSign=function(group,sign,cols){
 group.sign=sign;group.element.setAttribute('data-sign',sign);
 group.baseFace.setAttribute('data-face-sign',sign);group.scanFace.setAttribute('data-face-sign',-sign);group.clipRect.setAttribute('width',0);
 const label=`Group ${group.ordinal}: ${cols} ${sign<0?'negative':'positive'} counters`;group.element.setAttribute('aria-label',label);group.title.textContent=label;

VMC.randomExpression=function(previous){

 const signed=n=>Math.random()<.35?-n:n;
 let expression='';
 for(let attempt=0;attempt<20;attempt++){
  const kind=Math.random();
  if(kind<.45)expression=VMC.formatExpression([signed(integer(2,12)),signed(integer(2,12))]);
  else if(kind<.70)expression=VMC.formatExpression([signed(integer(2,8)),signed(integer(13,40))]);
  else if(kind<.85)expression=VMC.formatExpression([signed(integer(2,6)),signed(integer(2,6)),signed(integer(2,5))]);
  else expression=String(signed(integer(5,60)))+' + '+VMC.formatFactor(signed(integer(2,40)));
  if(expression!==previous)return expression;
 }
 return previous==='6 × 3'?'7 × 4':'6 × 3';
};

document.querySelector('#random-expression').addEventListener('click',()=>{
 const next=VMC.randomExpression(input.value);clearAll();input.value=next;calculate();
});
</script></body></html>
